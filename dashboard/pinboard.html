<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinboard</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<nav class="sidebar" data-sidebar>
  <a href="index.html" class="sidebar-brand"><img src="/logo.svg" class="sidebar-logo" alt="">project carb</a>
  <div class="sidebar-nav"></div>
  <div class="sidebar-spacer"></div>
  <div class="sidebar-profile" data-sidebar-profile></div>
</nav>

<div class="pb-container">
  <div class="pb-topbar">
    <div class="pb-topbar-left">
      <span class="pb-owner-label" data-pb-owner></span>
      <select class="pb-user-select" data-pb-user-select style="display:none;"></select>
    </div>
    <div class="pb-status" data-pb-status>0 items</div>
  </div>
  <div class="pb-canvas" id="pb-canvas">
    <svg id="pb-strings" class="pb-string-svg"><line class="preview" x1="0" y1="0" x2="0" y2="0" style="display:none;"/></svg>
    <div id="pb-world"></div>
    <div id="pb-select-box"></div>
  </div>
  <div class="pb-toolbar" id="pb-toolbar">
    <button class="pb-tool active" data-pb-tool="note">Note</button>
    <button class="pb-tool" data-pb-tool="checklist">List</button>
    <button class="pb-tool" data-pb-tool="link">Link</button>
    <div class="pb-tool-sep"></div>
    <label class="pb-tool">Image<input type="file" accept="image/*" data-pb-img-input hidden multiple></label>
    <label class="pb-tool">File<input type="file" data-pb-file-input hidden multiple></label>
  </div>
  <div class="pb-help">dbl-click — add card · drag — pan · scroll — zoom · right-click — color / connect · shift+drag — select group · backspace — delete · cmd+z — undo</div>
  <div class="pb-drop-overlay" data-pb-drop>Drop files or images here</div>
</div>

<!-- floating suggestion box -->
<div class="recs-bubble" data-open-recs>
  <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
</div>
<div class="recs-panel" data-recs-panel>
  <div class="recs-panel-header">
    <span class="recs-panel-title">Suggestions</span>
    <div class="recs-panel-close" data-close-recs>×</div>
  </div>
  <div class="recs-panel-body" data-recs-list></div>
  <div class="recs-panel-input"><input data-recs-send placeholder="Add a suggestion..."></div>
</div>

<!-- floating chat -->
<div class="chat-bubble" data-open-chat>
  <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</div>
<div class="chat-panel" data-chat-panel>
  <div class="chat-panel-header">
    <span class="chat-panel-title">Chat</span>
    <div class="chat-panel-close" data-close-chat>×</div>
  </div>
  <div class="chat-panel-body"></div>
  <div class="chat-compose">
    <div class="chat-compose-row">
      <div class="chat-compose-input"><input data-act="send" placeholder="Message..."></div>
      <button class="chat-send" data-send-btn title="Send"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg></button>
    </div>
    <div class="chat-compose-tools">
      <button class="chat-tool" data-chat-emoji title="Emoji"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></button>
      <button class="chat-tool" data-chat-gif title="GIF"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="2" y="4" width="20" height="16" rx="3"/><text x="12" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor" stroke="none">GIF</text></svg></button>
      <label class="chat-tool" data-chat-img title="Image / Video"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><input type="file" accept="image/*,video/*" data-chat-img-input hidden></label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="module" src="pinboard-app.js"></script>
</body>
</html>
